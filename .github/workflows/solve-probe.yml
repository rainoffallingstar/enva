name: Solve probe (temporary)

# Temporary diagnostic: decide which otter-core dependency adjustment makes the environment
# solvable against the current bioconda/conda-forge repodata. Not part of the release contract.
#
# The variant matrix used to infer mutations from substrings of the job label, which silently
# never unpinned `rmats` for the `unpin-bwa-rmats` label. Mutations are now explicit and each
# one must change the rendered YAML or the job fails.

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            mutations: ''
          - label: rmats-4.4.0
            mutations: 'rmats=4.4.0'
          - label: rmats-unpinned
            mutations: 'unpin-rmats'
          - label: rmats-unpinned-bwa-unpinned
            mutations: 'unpin-rmats,unpin-bwa'
          - label: rmats-4.4.0-python-3.11
            mutations: 'rmats=4.4.0,python=3.11'
          - label: no-bismark-bowtie2
            mutations: 'drop-bismark-bowtie2'
    steps:
      - name: Checkout enva
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build enva
        run: cargo build --release --bin enva

      - name: Materialise the candidate YAML
        env:
          PROBE_MUTATIONS: ${{ matrix.mutations }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          mutations = [token for token in os.environ["PROBE_MUTATIONS"].split(",") if token]
          text = pathlib.Path("src/configs/otter-core.yaml").read_text()

          for mutation in mutations:
              before = text
              if mutation == "unpin-rmats":
                  text = re.sub(r"(?m)^  - rmats=.*$", "  - rmats", text)
              elif mutation == "unpin-bwa":
                  text = re.sub(r"(?m)^  - bwa=.*$", "  - bwa", text)
              elif mutation == "drop-bismark-bowtie2":
                  text = re.sub(r"(?m)^  - (bismark|bowtie2)=.*\n", "", text)
              elif mutation.startswith("rmats="):
                  text = re.sub(r"(?m)^  - rmats=.*$", f"  - rmats={mutation.split('=', 1)[1]}", text)
              elif mutation.startswith("python="):
                  text = re.sub(r"(?m)^  - python=.*$", f"  - python={mutation.split('=', 1)[1]}", text)
              else:
                  raise SystemExit(f"unknown mutation: {mutation}")
              if text == before:
                  raise SystemExit(f"mutation had no effect: {mutation}")

          pathlib.Path("probe").mkdir(exist_ok=True)
          pathlib.Path("probe/candidate.yaml").write_text(text)
          for line in text.splitlines():
              if re.search(r"rmats|bismark|bowtie2|bwa|python|samtools", line):
                  print("CONSTRAINT:", line)
          PY

      - name: Attempt a real solve and install
        run: |
          set -euo pipefail
          export RATTLER_CACHE_DIR="${RUNNER_TEMP:-/tmp}/rattler-cache"
          mkdir -p "$RATTLER_CACHE_DIR" ci-logs
          ./target/release/enva create \
            --yaml probe/candidate.yaml \
            --name "probe-${{ matrix.label }}" \
            --force \
            --output summary \
            2>&1 | tee "ci-logs/probe-${{ matrix.label }}.log"
          echo "PROBE_SOLVED ${{ matrix.label }}"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solve-probe-${{ matrix.label }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 3
