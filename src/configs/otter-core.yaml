name: otter-core
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core Python
  # rmats 4.1.2 requires Python >= 3.9, so the environment cannot be pinned to 3.8.
  - python=3.10.13
  - numpy=1.24.4
  - pandas

  # QC Tools
  - fastqc
  - seqkit
  - seqtk
  - qualimap

  # Methylation Analysis
  # Rust Bismark 3.1.0 is the supported suite; Bowtie2 2.5.5 is
  # explicitly pinned to satisfy its documented runtime dependency.
  # Bowtie2 2.5.5 requires libzlib >= 1.3.1 while samtools 1.15.1 requires
  # libzlib < 1.3, so samtools is constrained by lower bound only.
  - bismark=3.1.0
  - bowtie2=2.5.5
  - trim-galore
  - samtools>=1.15
  - hdf5

  # RNA-seq Analysis
  - star
  - htseq=2.0.3
  - rmats=4.1.2

  # General Bioinformatics
  - picard

  # ChIP-seq/ATAC-seq Core Tools
  - macs2
  - bwa=0.7.17            # Alignment for ChIP-seq
  - pyyaml
